name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor and create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          # logo ke app icon hishebe use kora
          mkdir -p android/app/src/main/res/drawable
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Copy APK into website downloads folder
        run: |
          mkdir -p downloads
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/change-maker-academy.apk

      - name: Upload APK as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: change-maker-academy-apk
          path: downloads/change-maker-academy.apk

      - name: Commit APK so Vercel can serve it
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f downloads/change-maker-academy.apk
          git commit -m "Update APK" || echo "no changes"
          git push
