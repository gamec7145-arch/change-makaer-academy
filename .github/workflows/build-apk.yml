name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Update popup e ki dekhabe (changelog)"
        required: false
        default: "Bug fixes and improvements"
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set version number
        run: |
          echo "VC=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV

      - name: Install Capacitor and create Android project
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm install
          npx cap add android
          # Native plugins (screen guard + version check)
          cp native/*.java android/app/src/main/java/com/changemaker/academy/

          # Android 13+ e notification permission popup er jonno Manifest e permission lagbe
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$MANIFEST"

          # FileProvider paths (APK install er jonno cache folder allow)
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          XML

          # versionCode / versionName
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.$VC\"/" android/app/build.gradle

          # Custom app icon (CMA logo) - default Capacitor icon replace
          test -f assets/icon.png || { echo "ERROR: android-app/assets/icon.png repo-te nei. Upload kore Commit koro."; exit 1; }
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          convert assets/icon.png -resize 1024x1024 PNG32:assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:'#FEFEFE' PNG32:assets/icon-background.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android
          # Capacitor logo ke chhoto kore dey, tai foreground nijera boshai (logo boro dekhabe)
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            dir="android/app/src/main/res/mipmap-${d%%:*}"
            sz="${d##*:}"
            if [ -d "$dir" ]; then
              convert assets/icon.png -resize ${sz}x${sz} PNG32:"$dir/ic_launcher_foreground.png"
            fi
          done

          # Firebase push: secret GOOGLE_SERVICES_JSON thakle google-services.json boshabe
          # ar app er UA te CMAPush jog korbe (tahole js/push.js register korbe)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            sed -i 's/CMAApp"/CMAApp CMAPush"/' capacitor.config.json
            echo "Firebase push ENABLED"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret nai - push chalu hobe na"
          fi

          npx cap sync android

      - name: Use fixed signing key (update install hobe same signature e)
        run: |
          mkdir -p ~/.android
          cp android-app/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Copy APK and write version.json
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          mkdir -p downloads
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/change-maker-academy.apk
          jq -n \
            --argjson vc "$VC" \
            --arg vn "1.0.$VC" \
            --arg notes "${NOTES:-Bug fixes and improvements}" \
            '{versionCode:$vc, versionName:$vn, apkUrl:"downloads/change-maker-academy.apk", notes:$notes, force:false}' \
            > version.json
          cat version.json

      - name: Upload APK as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: change-maker-academy-apk
          path: downloads/change-maker-academy.apk

      - name: Commit APK and version.json so Vercel can serve them
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f downloads/change-maker-academy.apk version.json
          git commit -m "Update APK to 1.0.$VC" || echo "no changes"
          git push
