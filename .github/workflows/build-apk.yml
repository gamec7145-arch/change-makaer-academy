name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Update popup e ki dekhabe (changelog)"
        required: false
        default: "Bug fixes and improvements"
      force:
        description: "Force update? (true = user 'Pore' chapte parbe na)"
        required: false
        default: "false"
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set version number
        run: |
          echo "VC=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV

      - name: Install Capacitor and create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          # Native plugins (screen guard + in-app updater)
          cp native/*.java android/app/src/main/java/com/changemaker/academy/

          # Update install permission
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$MANIFEST"

          # FileProvider paths (APK install er jonno cache folder allow)
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          XML

          # versionCode / versionName
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.$VC\"/" android/app/build.gradle

          # Phone home screen app icon (android-app/icon.png theke banay)
          SRC=""
          for f in icon.png "icon.png." ../icon.png ../change-maker-logo.png; do
            if [ -f "$f" ]; then SRC="$f"; break; fi
          done
          if [ -n "$SRC" ]; then
            echo "ICON_SOURCE: $SRC"
            # ImageMagick install (ubuntu-latest e 'convert' na-o thakte pare)
            if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y imagemagick
            fi
            if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
            echo "ICON_TOOL: $IM"
            RES=android/app/src/main/res
            make_icon () {
              D=$1; L=$2; F=$3
              INNER=$((L * 80 / 100))
              $IM "$SRC" -resize ${INNER}x${INNER} -background white -gravity center -extent ${L}x${L} "$RES/mipmap-$D/ic_launcher.png"
              C=$((L / 2))
              $IM "$RES/mipmap-$D/ic_launcher.png" \( -size ${L}x${L} xc:black -fill white -draw "circle $C,$C $C,0" \) -alpha off -compose copy_opacity -composite "$RES/mipmap-$D/ic_launcher_round.png"
              FIN=$((F * 62 / 100))
              $IM "$SRC" -resize ${FIN}x${FIN} -background none -gravity center -extent ${F}x${F} "$RES/mipmap-$D/ic_launcher_foreground.png"
            }
            make_icon mdpi 48 108
            make_icon hdpi 72 162
            make_icon xhdpi 96 216
            make_icon xxhdpi 144 324
            make_icon xxxhdpi 192 432
            # Adaptive icon ke amader icon e point kora (default Capacitor icon override)
            mkdir -p $RES/values $RES/mipmap-anydpi-v26
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="cma_icon_bg">#FFFFFF</color>\n</resources>\n' > $RES/values/cma_icon_bg.xml
            for N in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/cma_icon_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$N.xml
            done
            # purano default icon file gulo muche dao
            rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
            echo "ICON_STATUS: launcher icon toiri hoyeche, source = $SRC"
            ls -la $RES/mipmap-xxxhdpi/ $RES/mipmap-anydpi-v26/
          else
            echo "::error::ICON_STATUS: kono icon file paoa jayni (android-app/icon.png ba change-maker-logo.png)"
            exit 1
          fi

          npx cap sync android

      - name: Use fixed signing key (update install hobe same signature e)
        run: |
          mkdir -p ~/.android
          cp android-app/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Copy APK and write version.json
        env:
          NOTES: ${{ github.event.inputs.notes }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          mkdir -p downloads
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/change-maker-academy.apk
          jq -n \
            --argjson vc "$VC" \
            --arg vn "1.0.$VC" \
            --arg notes "${NOTES:-Bug fixes and improvements}" \
            --argjson force "$([ "$FORCE" = "true" ] && echo true || echo false)" \
            '{versionCode:$vc, versionName:$vn, apkUrl:"downloads/change-maker-academy.apk", notes:$notes, force:$force}' \
            > version.json
          cat version.json

      - name: Upload APK as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: change-maker-academy-apk
          path: downloads/change-maker-academy.apk

      - name: Commit APK and version.json so Vercel can serve them
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f downloads/change-maker-academy.apk version.json
          git commit -m "Update APK to 1.0.$VC" || echo "no changes"
          git push
